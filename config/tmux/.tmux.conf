set-option -g history-limit 100000
set -g mouse on

# Gradual wheel scrolling — 2 lines per tick, auto-exit copy mode at bottom
bind -n WheelUpPane   if -F "#{mouse_any_flag}" "send -M" "if -F '#{pane_in_mode}' 'send -M' 'copy-mode -e ; send -X -N 2 scroll-up'"
bind -n WheelDownPane if -F "#{mouse_any_flag}" "send -M" "send -X -N 2 scroll-down"

bind -T copy-mode-vi WheelUpPane   send -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 2 scroll-down
bind -T copy-mode    WheelUpPane   send -X -N 2 scroll-up
bind -T copy-mode    WheelDownPane send -X -N 2 scroll-down
